name: Build and Deploy

on:
  push:
    branches:
      - main
      - csm-dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    environment: github-actions

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Extract repository name
        id: extract-repo-name
        uses: actions/github-script@v4
        with:
          script: |
            const repoName = process.env.GITHUB_REPOSITORY.split('/')[1];
            core.setOutput('repo', repoName);

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Go binary
      - name: Build Go binary
        run: |
          export CGO_ENABLED=0
          go build -o bin/app

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/christopherscot/${{ steps.extract-repo-name.outputs.repo }}:latest
            ${{ env.REGISTRY }}/christopherscot/${{ steps.extract-repo-name.outputs.repo }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      # No Argo Publish step. The template pushes rendered manifests from
      # here into the homelab repo, which needs a CI_PAT able to write that
      # repo - a long-lived credential, held in a service repo, with write
      # access to the repository that controls the whole cluster. That token
      # has never existed in this setup.
      #
      # Instead argocd-image-updater watches GHCR from inside the cluster
      # and writes each new :latest digest into the homelab repo using
      # Argo's own credentials. Same push-to-deploy, same digest recorded in
      # git, no new credential. See the annotations on
      # app-of-apps/apps/approvald.yaml in the homelab repo.
