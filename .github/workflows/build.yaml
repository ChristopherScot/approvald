# Builds and pushes the image. Deployment happens in-cluster:
# argocd-image-updater watches the registry and commits the new digest to
# the homelab repo itself, so this workflow needs no homelab credential -
# GITHUB_TOKEN is issued per run and can only push packages.
name: build approvald

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession otherwise race to publish :latest, and
# whichever loses is the digest image-updater may pick up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # go-version-file and cache-dependency-path are ACTION INPUTS, not
      # shell commands, so defaults.run.working-directory does not apply
      # to them - they resolve from the repository root. In a monorepo a
      # bare `go.mod` is a path to nothing, and setup-go fails with "the
      # specified go version file at: go.mod does not exist" before a
      # single test has run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./...

      # CGO_ENABLED=0: a cgo binary links against glibc and will not run on
      # alpine, and that only shows up at container start.
      #
      # -X main.version stamps the commit into the binary, so every log
      # line says which build produced it. Without it main.version stays
      # "dev" and the field is worse than absent.
      - name: Build
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-X main.version=$GITHUB_SHA" \
            -o bin/app .

      # One binary for both checks below. Downloaded rather than built so
      # CI does not depend on this repo being able to compile it.
      - name: Install homelabctl
        run: curl -fsSL https://github.com/ChristopherScot/ci-scripts/releases/latest/download/homelabctl_linux_amd64.tar.gz | tar -xz

      # openapi.yml is the source of truth, so everything derived from it
      # - the server interface, both clients, the versions they report -
      # must match what is committed. Otherwise a spec change merges with
      # stale code and the API quietly diverges from its documentation.
      #
      # `regen` runs the same commands `init` does, so CI cannot check a
      # different thing than a developer regenerates.
      # regen is deterministic - it generates from the spec and does not
      # touch dependencies - so the whole tree can be diffed. Anything it
      # changes here is something a spec edit should have regenerated.
      - name: Check generated code is current
        run: |
          ./homelabctl regen
          git diff --exit-code \
            || { echo "::error::generated code is stale - run 'homelabctl regen' and commit"; exit 1; }

      - name: Check deploy manifests
        run: ./homelabctl check deploy

      # The manifests are derived from config.yaml, so a config change
      # that nobody re-rendered leaves them describing the old service -
      # and `check deploy` would not notice, because it validates what
      # is there rather than comparing it to what the config says.
      #
      # render takes no image ref and preflight degrades to a notice
      # without a cluster, so this is deterministic here: the same
      # config always produces the same files.
      - name: Check manifests match config.yaml
        run: |
          ./homelabctl render
          git diff --exit-code -- deploy/ \
            || { echo "::error::manifests are stale - run 'homelabctl render' and commit"; exit 1; }

      # buildx, because cache-from/cache-to type=gha below need it: the
      # default docker driver cannot export a cache and fails the build
      # with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      # ghcr.io specifically: github.actor + GITHUB_TOKEN authenticate
      # to GitHub's registry and nothing else. Pointing image.repository
      # at ECR or Docker Hub means replacing this step with that
      # registry's login action and a stored credential - and note
      # `homelabctl init --overwrite` rewrites this file from the
      # template, which would discard that edit.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/approvald
          # Full SHA: an abbreviated one is not a registry tag and gives
          # ImagePullBackOff.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tagging the repo IS releasing the client: api/ is committed and
  # self-contained, so a consumer runs `go get <repo>@<tag>`. No registry
  # and no publish step - the tag is the artifact.
  #
  # Keyed on the spec's info.version so one version covers the API and its
  # clients, and so a release is deliberate rather than every push.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # No id-token: publishing is publish.yaml's, and this job only
      # pushes a tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Tag when the spec version changed
        run: |
          spec=openapi.yml
          version=$(grep -m1 '^  version:' "$spec" | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::$spec has no info.version"
            exit 1
          fi

          # Tag whenever the CURRENT version has no tag, rather than when
          # THIS push changed it.
          #
          # The diff-based form of this check skips a release permanently
          # whenever a build fails. needs.build gates this job, so the
          # commit that bumped the version never reaches here, and every
          # later push reports "unchanged". A spec ran three versions
          # ahead of its published client that way, with no failure to
          # point at - consumers just kept resolving the old package.
          #
          # Asking "is the current version released" makes the job
          # idempotent: a green build after a red one recovers the
          # release on its own, and a push that changes nothing is a
          # no-op because the tag is already there.
          # Against the REMOTE, not the local clone. actions/checkout
          # does not fetch tags, so `git rev-parse` here knows about
          # none of them and happily re-tags a version that is already
          # released - the push then fails with "already exists" and
          # turns a clean no-op into a red build.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version already tagged; nothing to do"
            exit 0
          fi

          git tag "v$version"
          git push origin "v$version"
          echo "tagged v$version - consumers can now: go get $GITHUB_REPOSITORY@v$version"
          echo "publish=true" >> $GITHUB_OUTPUT
        id: spec

      # Publishing the TypeScript client is publish.yaml's job.
      #
      # npm trusted publishing is configured per package and the workflow
      # FILENAME is one of the fields fixed at setup. Publishing from
      # here would mean a configuration naming a different workflow for
      # every package; one publish.yaml at the repo root means the same
      # three values every time. The tag pushed above is its trigger.
