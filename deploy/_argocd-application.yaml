apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: approvald
  namespace: argocd
  labels:
    team: me-myself-and-i
  annotations:
    argocd-image-updater.argoproj.io/image-list: approvald=ghcr.io/christopherscot/approvald:latest
    argocd-image-updater.argoproj.io/approvald.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/ChristopherScot/homelab'
    targetRevision: HEAD
    path: approvald
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: approvald
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
