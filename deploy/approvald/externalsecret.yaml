apiVersion: v1
kind: ServiceAccount
metadata:
  name: approvald
  namespace: approvald
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-approvald
  namespace: approvald
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: approvald
          serviceAccountRef:
            name: approvald
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: approvald-secrets
  namespace: approvald
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-approvald
    kind: SecretStore
  target:
    name: approvald-secrets
  data:
    - secretKey: NTFY_TOKEN
      remoteRef: { key: approvald/config, property: ntfy_token }
    - secretKey: REGISTER_TOKEN
      remoteRef: { key: approvald/config, property: register_token }
